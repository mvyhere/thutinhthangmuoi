<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#deddd7" />
    <title>Thư tình tháng mười</title>
    <style>
      :root {
        --bg: #deddd7;
        --ink: #1a1a1a;
        --panel: rgba(255,255,255,.38);
        --line: rgba(26,26,26,.18);
        --accent: #d95fa5;
        --muted: #5f5d5a;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
      }

      .studio {
        width: min(1180px, 100%);
        padding: 20px;
      }

      .stage-wrap {
        position: relative;
        background: rgba(255,255,255,.18);
        border: 1px solid var(--line);
        padding: 18px;
      }

      .stage {
        position: relative;
        width: min(100%, 980px);
        margin: 0 auto;
        aspect-ratio: 3508 / 2480;
        border: 1px solid rgba(0,0,0,.08);
        background: rgba(255,255,255,.2);
        overflow: hidden;
        cursor: crosshair;
      }

      .page {
        position: absolute;
        inset: 0;
        background-image: url("zine.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        border: 0;
        display: block;
      }

      .page::after {
        content: "";
        position: absolute;
        inset: 0;
        border: 1px solid rgba(0,0,0,.08);
      }

      .control-dock {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        margin-top: 16px;
        flex-wrap: wrap;
      }

      .mode-tabs,
      .page-controls,
      .utilities {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .mode-tabs {
        background: rgba(255,255,255,.42);
        border: 1px solid rgba(0,0,0,.1);
        padding: 4px;
      }

      .mode-button,
      .page-button,
      .utility-button {
        border: 1px solid rgba(0,0,0,.16);
        background: rgba(255,255,255,.5);
        color: var(--ink);
        padding: 10px 14px;
        cursor: pointer;
        font-size: 12px;
      }

      .mode-button[aria-pressed="true"] {
        background: #171717;
        color: #fff;
        border-color: #171717;
      }

      .page-button {
        width: 38px;
        height: 38px;
        padding: 0;
        font-size: 22px;
        line-height: 1;
      }

      .page-count {
        min-width: 90px;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        letter-spacing: .08em;
      }

      .magnifier {
        position: absolute;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,.8);
        background: rgba(255,255,255,.4);
        box-shadow: 0 12px 24px rgba(0,0,0,.18);
        pointer-events: none;
        opacity: 0;
        transform: scale(.7);
        transition: opacity .15s ease, transform .15s ease;
        overflow: hidden;
        z-index: 10;
      }

      .magnifier.visible {
        opacity: 1;
        transform: scale(1);
      }

      .magnifier canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      @media (max-width: 620px) {
        .studio { padding: 12px; }
        .stage-wrap { padding: 10px; }
        .control-dock {
          flex-direction: column;
          align-items: stretch;
        }
        .mode-tabs,
        .page-controls,
        .utilities {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <main class="studio">
      <div class="stage-wrap">
        <div class="stage" id="stage" aria-label="Thư tình tháng mười">
          <div class="page" id="mainPage" aria-label="Zine page"></div>
          <div class="magnifier" id="magnifier" aria-hidden="true">
            <canvas id="magnifierCanvas" width="360" height="360"></canvas>
          </div>
        </div>
      </div>

      <div class="control-dock">
        <div class="mode-tabs" role="group" aria-label="Chế độ xem">
          <button class="mode-button" type="button" aria-pressed="true">Đọc zine</button>
          <button class="mode-button" type="button" aria-pressed="false">Bung phẳng</button>
        </div>

        <div class="page-controls" aria-label="Điều hướng trang">
          <button class="page-button" id="prevButton" type="button" aria-label="Trang trước">‹</button>
          <span class="page-count" id="pageCount">01 / 08</span>
          <button class="page-button" id="nextButton" type="button" aria-label="Trang sau">›</button>
        </div>

        <div class="utilities">
          <button class="utility-button" id="musicButton" type="button" aria-label="Mở nhạc">♫</button>
        </div>
      </div>
    </main>

    <script>
      const stage = document.getElementById('stage');
      const page = document.getElementById('mainPage');
      const pageCount = document.getElementById('pageCount');
      const prevButton = document.getElementById('prevButton');
      const nextButton = document.getElementById('nextButton');
      const magnifier = document.getElementById('magnifier');
      const canvas = document.getElementById('magnifierCanvas');
      const ctx = canvas.getContext('2d');
      const musicButton = document.getElementById('musicButton');

      const artwork = new Image();
      artwork.src = 'zine.png';

      let currentPage = 1;
      const totalPages = 8;

      function updatePageDisplay() {
        const pageNumber = String(currentPage).padStart(2, '0');
        pageCount.textContent = `${pageNumber} / ${String(totalPages).padStart(2, '0')}`;

        const offset = (currentPage - 1) * 12.5;
        page.style.backgroundPosition = `${offset}% 0%`;
        page.style.backgroundSize = `${totalPages * 100}% 100%`;
      }

      function setPage(nextPage) {
        currentPage = Math.max(1, Math.min(totalPages, nextPage));
        updatePageDisplay();
      }

      prevButton.addEventListener('click', () => setPage(currentPage - 1));
      nextButton.addEventListener('click', () => setPage(currentPage + 1));

      function showMagnifier(event) {
        if (!artwork.complete) return;

        const rect = stage.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        const zoom = 3.2;
        const lensSize = 360;

        const sourceX = Math.max(0, Math.min(artwork.naturalWidth - 1, x / rect.width * artwork.naturalWidth));
        const sourceY = Math.max(0, Math.min(artwork.naturalHeight - 1, y / rect.height * artwork.naturalHeight));
        const cropSize = Math.max(80, lensSize / zoom);

        const cx = Math.max(0, Math.min(artwork.naturalWidth - cropSize, sourceX - cropSize / 2));
        const cy = Math.max(0, Math.min(artwork.naturalHeight - cropSize, sourceY - cropSize / 2));

        ctx.clearRect(0, 0, lensSize, lensSize);
        ctx.beginPath();
        ctx.arc(lensSize / 2, lensSize / 2, lensSize / 2 - 8, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(artwork, cx, cy, cropSize, cropSize, 0, 0, lensSize, lensSize);

        magnifier.style.left = `${x - 100}px`;
        magnifier.style.top = `${y - 100}px`;
        magnifier.classList.add('visible');
      }

      function hideMagnifier() {
        magnifier.classList.remove('visible');
      }

      stage.addEventListener('pointermove', showMagnifier);
      stage.addEventListener('pointerleave', hideMagnifier);

      musicButton.addEventListener('click', () => {
        window.open('https://open.spotify.com/embed/playlist/3l0ZEJJgtANJEF5Kkvq1XN?si=4dcd4d1a6d5049d1', '_blank');
      });

      updatePageDisplay();
    </script>
  </body>
</html>
